services:
  - type: worker
    name: eko-metropolis-bot
    env: python
    plan: free
    buildCommand: >
      pip install -r requirements.txt &&
      curl -L https://github.com/benbjohnson/litestream/releases/download/v0.3.13/litestream-v0.3.13-linux-amd64.tar.gz -o litestream.tar.gz &&
      tar -xzf litestream.tar.gz &&
      chmod +x litestream
    startCommand: >
      ./litestream restore -if-replica-exists -config litestream.yml ekobot.db &&
      ./litestream replicate -config litestream.yml -exec "python bot.py"
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: COMMAND_PREFIX
        value: "!"
      - key: DB_PATH
        value: ekobot.db
      - key: B2_BUCKET
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
